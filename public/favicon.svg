<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!--
        Bíblia fechada de frente: lombada à esquerda e cruz vazada na capa.
        Ouro envelhecido sobre tinta quente — as cores do tema escuro do app.

        As medidas foram escolhidas olhando o ícone a 16px, não a 64: o livro
        ocupa quase todo o quadro e as barras da cruz têm 7/64 de largura
        (~1,75px na aba do navegador). Versões menores ou mais finas viravam
        borrão nesse tamanho.
    -->
    <rect width="64" height="64" rx="13" fill="#17130C" />
    <rect x="10" y="7" width="44" height="50" rx="4" fill="#C9A34C" />
    <rect x="17" y="7" width="3.2" height="50" fill="#17130C" />
    <rect x="34" y="16" width="7" height="32" rx="0.8" fill="#17130C" />
    <rect x="26" y="28.5" width="23" height="7" rx="0.8" fill="#17130C" />
</svg>
