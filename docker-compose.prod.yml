services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: biblia-app:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: biblia
      MYSQL_USER: biblia
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - biblia-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - biblia-redis-data:/data

volumes:
  biblia-mysql-data:
  biblia-redis-data:
